version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Ein Pull Request pro Gruppe statt fünf einzelne. Das Projekt hat wenige
      # Abhängigkeiten, da lohnt sich kein Einzelverkehr.
      produktion:
        dependency-type: production
      entwicklung:
        dependency-type: development
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
